# Auto-generate a GitHub Release when a version tag is pushed.
# Release notes are built from Conventional Commit messages since the previous tag.
name: Release

on:
  push:
    tags:
      # Matches semver tags, with or without a leading "v" (e.g. 1.4.0, v1.4.0)
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

# Needed to create the release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + all tags so we can diff against the previous tag
          fetch-depth: 0

      - name: Build release notes from conventional commits
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Previous tag (by version order); empty on the very first tag
          PREV_TAG="$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE="${PREV_TAG}...${TAG}"
          else
            RANGE="${TAG}"
            COMPARE=""
          fi

          # Collect "<type>|<subject> (<short-sha>)" for each commit in range
          commits="$(git log "$RANGE" --no-merges --pretty=format:'%s|%h')"

          feat=""; fix=""; perf=""; refactor=""; docs=""; style=""; chore=""; other=""
          while IFS='|' read -r subject sha; do
            [ -z "$subject" ] && continue
            # Skip release/version-bump bookkeeping commits, e.g.
            # "chore: release v1.4.0", "chore: update version to 1.3.0"
            if printf '%s' "$subject" | grep -qiE '^[a-z]+(\([^)]*\))?!?:[[:space:]]*(release\b|(update|bump)[[:space:]]+version\b)'; then
              continue
            fi
            # Strip optional scope, e.g. "feat(editor): x" -> type "feat"
            type="$(printf '%s' "$subject" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')"
            desc="$(printf '%s' "$subject" | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*//')"
            line="- ${desc} (${sha})"
            case "$type" in
              feat)            feat="${feat}${line}"$'\n' ;;
              fix)             fix="${fix}${line}"$'\n' ;;
              perf)            perf="${perf}${line}"$'\n' ;;
              refactor)        refactor="${refactor}${line}"$'\n' ;;
              docs)            docs="${docs}${line}"$'\n' ;;
              style)           style="${style}${line}"$'\n' ;;
              chore|build|ci)  chore="${chore}${line}"$'\n' ;;
              *)               other="${other}- ${subject} (${sha})"$'\n' ;;
            esac
          done <<< "$commits"

          {
            echo "## What's Changed"
            echo ""
            [ -n "$feat" ]     && { echo "### ✨ Features";        echo ""; printf '%s' "$feat";     echo ""; }
            [ -n "$fix" ]      && { echo "### 🐛 Bug Fixes";       echo ""; printf '%s' "$fix";      echo ""; }
            [ -n "$perf" ]     && { echo "### ⚡ Performance";      echo ""; printf '%s' "$perf";     echo ""; }
            [ -n "$refactor" ] && { echo "### ♻️ Refactoring";     echo ""; printf '%s' "$refactor"; echo ""; }
            [ -n "$docs" ]     && { echo "### 📝 Documentation";   echo ""; printf '%s' "$docs";     echo ""; }
            [ -n "$style" ]    && { echo "### 💄 Styling";         echo ""; printf '%s' "$style";    echo ""; }
            [ -n "$chore" ]    && { echo "### 🔧 Chores";          echo ""; printf '%s' "$chore";    echo ""; }
            [ -n "$other" ]    && { echo "### 📦 Other";           echo ""; printf '%s' "$other";    echo ""; }
            if [ -n "$COMPARE" ]; then
              echo ""
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${COMPARE}"
            fi
          } > release_notes.md

          echo "Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --verify-tag
